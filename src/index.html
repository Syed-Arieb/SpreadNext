<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>SpreadNext</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <script>
      (() => {
        try {
          const stored = localStorage.getItem('spreadnext-theme');
          const dark = stored
            ? stored === 'dark'
            : !window.matchMedia('(prefers-color-scheme: light)').matches;
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Ubuntu+Sans:ital,wght@0,100..800;1,100..800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <app-root class="size-full"></app-root>
  </body>
</html>
