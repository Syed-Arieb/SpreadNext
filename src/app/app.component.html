<div class="container">
  <header class="app-header">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg [cIcon]="icons.cilSpreadsheet"></svg>
      </span>
      <span class="brand-name">{{ title }}</span>
    </div>

    <span class="divider" aria-hidden="true"></span>

    <input
      class="doc-title"
      type="text"
      aria-label="Spreadsheet title"
      spellcheck="false"
      autocomplete="off"
      [value]="documentTitle"
      (input)="onTitleInput($event)"
      (focus)="onTitleFocus($event)"
    />

    <span class="spacer"></span>

    <span class="save-status" [class.dirty]="unsavedChanges">
      {{ unsavedChanges ? 'Unsaved changes' : 'Saved locally' }}
    </span>

    <button
      class="icon-button"
      type="button"
      (click)="toggleTheme()"
      [attr.aria-label]="darkMode ? 'Switch to light theme' : 'Switch to dark theme'"
      [title]="darkMode ? 'Switch to light theme' : 'Switch to dark theme'"
    >
      <svg [cIcon]="darkMode ? icons.cilSun : icons.cilMoon" aria-hidden="true"></svg>
    </button>
  </header>

  <app-spreadsheet
    [documentTitle]="documentTitle"
    (cellChange)="onCellChange()"
    (sheetChange)="onSheetChange()"
    (saved)="onSaved()"
  />
</div>
