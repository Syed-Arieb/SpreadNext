<table class="spreadsheet">
  <thead>
    <tr>
      @for (title of columnTitles; track title) {
        <td>
          <input type="text" class="bold" value="{{ title }}" />
        </td>
      }
    </tr>
  </thead>
  <tbody>
    @for (i of rowIndices; track i) {
      <tr>
        @for (j of columnIndices; track j) {
          <td>
            <input type="text" name="" id="" [(ngModel)]="cellData[i][j]" (ngModelChange)="onCellChange($event, i, j)"/>
          </td>
        }
      </tr>
    }
  </tbody>
  <div class="button-group">
    <button (click)="addRow()">
      Add Row
    </button>
    <button (click)="addColumn()">
      Add Column
    </button>
  </div>
</table>
